[package]
name = "wa-wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
arboard = "3.4"
rand = "0.8"
argon2 = "0.5"
tabled = "0.16"
aes-gcm = "0.10"
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
dialoguer = { version = "0.11", features = ["default"] }
directories = "6.0.0"

[[bin]]
name = "ww"
path = "src/main.rs"
